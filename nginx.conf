server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # situs berada di belakang reverse proxy VPS; cukup HTTP polos di sini
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # aset ber-hash Nuxt & font self-hosted: cache setahun, immutable
    location ~ ^/(_nuxt|_fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML & payload data: selalu revalidasi agar update konten langsung terlihat
    location ~ (\.html|_payload\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
